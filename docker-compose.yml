services:
  sharelatex:
    image: ${OVERLEAF_IMAGE_NAME:-codemolabs/overleaf:latest}
    container_name: ${OVERLEAF_SHARELATEX_CONTAINER:-sharelatex}
    restart: unless-stopped
    mem_limit: 1184m
    memswap_limit: 1792m
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${OVERLEAF_LISTEN_IP:-127.0.0.1}:${OVERLEAF_PORT:-80}:80"
    stop_grace_period: 60s
    volumes:
      - ${OVERLEAF_DATA_DIR:-./data/overleaf}:/var/lib/overleaf
      - ${OVERLEAF_PROJECTS_HOST_DIR:-./data/projects}:/projects:rw
      - ${OVERLEAF_TEXMF_LOCAL_DIR:-./data/texlive-local}:/usr/local/texlive/texmf-local:rw
    environment:
      OVERLEAF_APP_NAME: "Overleaf: COSL Edition for Enterprises"
      OVERLEAF_MONGO_URL: mongodb://mongo/sharelatex
      OVERLEAF_REDIS_HOST: redis
      REDIS_HOST: redis
      ENABLED_LINKED_FILE_TYPES: "project_file,project_output_file"
      ENABLE_CONVERSIONS: "true"
      EMAIL_CONFIRMATION_DISABLED: "true"
      LOCAL_SYNC_ALLOWED_ROOT: "/projects"
      LOCAL_SYNC_DEFAULT_BASE_DIR: "/projects/OverleafProjects"
      OVERLEAF_ENABLE_PACKAGE_HUB: "true"
      MAX_UNFLUSHED_AGE_SECONDS: "15"
      CONTINUOUS_BACKGROUND_FLUSH: "true"

  mongo:
    image: mongo:8.0.4
    container_name: ${OVERLEAF_MONGO_CONTAINER:-mongo}
    restart: unless-stopped
    mem_limit: 288m
    memswap_limit: 512m
    command: ["--replSet", "overleaf", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - ${OVERLEAF_MONGO_DATA_DIR:-./data/mongo}:/data/db
      - ./bin/shared/mongodb-init-replica-set.js:/docker-entrypoint-initdb.d/mongodb-init-replica-set.js:ro
    environment:
      MONGO_INITDB_DATABASE: sharelatex
    extra_hosts:
      - mongo:127.0.0.1
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/27017'"]
      interval: 30s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4
    container_name: ${OVERLEAF_REDIS_CONTAINER:-redis}
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 96m
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "48mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - ${OVERLEAF_REDIS_DATA_DIR:-./data/redis}:/data
